[package]
name = "rust-lstm-1025"
version = "0.1.2"
edition = "2024"

description = "A Rust implementation of a BMI (Basic Model Interface) adapter for LSTM-based streamflow prediction."
readme = "./README.md"
authors = ["Josh Cunningham <jcunningham8@ua.edu>"]
license = "MIT"

repository = "https://github.com/CIROH-UA/rust-lstm"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bmi-rs = { git = "https://github.com/joshcu/bmi-rs/", package = "bmi-rs", branch = "compat", features = ["compat"] }
burn = { version = "0.22.1", features = ["flex", "pytorch"] }
ffi = { git = "https://github.com/joshcu/bmi-rs/", package = "bmi-rs-sys", branch = "compat" }
glob = "0.3.3"
serde = { version = "1.0.226", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
criterion = "0.8"
# NdArray is deprecated in burn 0.22; only the benchmark uses it, as a comparison point.
burn = { version = "0.22.1", features = ["ndarray"] }

[[bench]]
name = "lstm"
harness = false
